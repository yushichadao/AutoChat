name: 功能建议
description: 提出一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **本项目仅供学习与个人使用。** 不得用于冒充他人、批量群发、诈骗等用途。
        涉及违法用途的功能建议会被直接关闭，见 [CODE_OF_CONDUCT.md](../blob/main/CODE_OF_CONDUCT.md)。
  - type: checkboxes
    attributes:
      label: 前置确认
      options:
        - label: 我的使用场景合法合规
          required: true
        - label: 我已搜索过已有 issue / discussion，这不是重复建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么麻烦？现在的做法是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？如果有几种设计，说明一下取舍。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
  - type: checkboxes
    attributes:
      label: 补充
      options:
        - label: 这个功能会提高"自动化滥用能力"（如批量群发、绕过风控）
          required: false
        - label: 我愿意提交 PR 实现这个功能
          required: false
